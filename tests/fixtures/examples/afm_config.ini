# ------------------------------- USER INPUTS --------------------------------

# ----------------------- 2D Sheet ----------
[2D]
mat = MoS2 # Material ID "mp-2815" MoS2 "mp-1634" MoSe2
cif_path = examples/materials/h-MoS2.cif
# For a material sweep, replace the two lines above and pot_path below with:
#   materials_list = examples/material_list.txt
#   mat = {mat}
#   cif_path = examples/materials/{mat}.cif
#   pot_path = examples/potentials/sw/sw_lammps/{mat}.sw
x = 100 # length of sheet in Angstrom
y = 100 # width of sheet in Angstrom
layers = [1,2,3] # Number of layers, multiple inputs possible i.e. 1,2,3
pot_path = examples/potentials/sw/MoS2_wen.sw # potential path
pot_type = sw
stack_type = AB # AB or AA
lat_c =  # lattice constant in Angstrom (default is 6)

# ----------------------- Tip ---------------
[tip]
mat = Si # Material ID 
amorph =  # Amorphous: a for True,  for False
r = 25 # radius of AFM tip in Angstrom
dspring = 1.6e-6 # spring damper
tip_x =  # optional explicit tip x-position in box coordinates
tip_y =  # optional explicit tip y-position in box coordinates
tip_x_offset = 0.0 # used only when tip_x is not set
tip_y_offset = 0.0 # used only when tip_y is not set
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- Substrate ---------
[sub]
mat = Si # Material ID 
amorph = a # Amorphous: 'a' for True, '' for False
thickness = 12 # thickness of substrate in Angstrom
x = 140 # substrate length in Angstrom (finite-sheet mode)
y = 140 # substrate width in Angstrom (finite-sheet mode)
pot_path = examples/potentials/sw/Si.sw
pot_type = sw
cif_path = examples/materials/Si.cif

# ----------------------- General -----------
[general]
temp = 300 # in K
find = 5 # in nN
force = [2,5,10,20,30,50,70,85,100] # in nN
# Scan angles in degrees, ascending. There is no [lower, upper, interval, force]
# spec form -- list the angles. They loop inside one script, so the list does not
# multiply the output directories. `scan_angle_force` names the force value from
# the list above that the angle loop pairs with.
scan_angle = [2, 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50, 54, 58, 62, 66, 70, 74, 78, 82, 86, 90]
scan_angle_force = 30 # in nN, must be one of the [general] force values
driving_spring = 50 # spring constant in N/m
scan_speed = 2 # AFM tip scan speed in m/s
finite_sheet = false # set true to use [sub] x/y finite-sheet geometry
# finite_sheet_afm_edge_mode = spring  # 'spring' or 'none'
# finite_sheet_edge_spring_k = 10.0   # eV/Å², spring constant for 'spring' mode


