[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FrictionSim2D"
version = "0.1.0"
description = "A tool for generating LAMMPS input scripts for 2D material friction simulations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Matteo Valderrama", email = "m.valderrama23@imperial.ac.uk"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.21",
  "ase>=3.22",
  "lammps>=2023.8.2",  # Python bindings for LAMMPS
  "PyYAML>=6.0",
  "jinja2>=3.1",
  "pydantic>=2.0",
  "click>=8.0",
  "pandas>=1.5",
]

[project.scripts]
FrictionSim2D = "src.cli:main"

[project.optional-dependencies]
aiida = [
  "aiida-core>=2.0",
  "typing_extensions>=4.0",
  # rabbitmq-server and postgresql are system / conda dependencies.
  # Install via:  conda install -c conda-forge aiida-core aiida-core.services
  # Then run:     rabbitmq-server -detached
  #               verdi presto --use-postgres
]
db = [
  "psycopg2-binary>=2.9",
]
plotting = [
  "matplotlib>=3.5",
  "seaborn>=0.12",
  "scipy>=1.8",
]
api = [
  "fastapi>=0.100",
  "uvicorn[standard]>=0.20",
  "httpx>=0.24",
]
gui = [
  # ovito supplies the embedded interactive viewport (Viewport.create_qt_widget).
  # It pins its own PySide6 (>=6.8.3 for ovito 3.15); do not install PySide6 from
  # conda alongside it -- the two Qt builds conflict.  create_qt_widget is only
  # verified from 3.15 onwards.
  "ovito>=3.15",
  "PySide6>=6.8.3",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pylint>=2.15",
  "httpx>=0.24",
  "pytest-qt>=4.2",
]
all = [
  "FrictionSim2D[aiida,db,plotting,api,gui]",
]

# ---------------------------------------------------------------------------
# AiiDA entry points — required for plugin discovery by aiida-core
# ---------------------------------------------------------------------------
[project.entry-points."aiida.data"]
"friction2d.simulation"     = "src.aiida.data.simulation:FrictionSimulationData"
"friction2d.simulation_set" = "src.aiida.data.simulation_set:FrictionSimulationSetData"
"friction2d.results"        = "src.aiida.data.results:FrictionResultsData"

[project.entry-points."aiida.calculations"]
"friction2d.lammps" = "src.aiida.calcjob:LammpsFrictionCalcJob"

[project.entry-points."aiida.parsers"]
"friction2d.lammps" = "src.aiida.calcjob:LammpsFrictionParser"

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not lammps'"
markers = [
    "lammps: executes real LAMMPS runs (skipped when lmp_serial is absent; deselect with -m 'not lammps')",
    "integration: cross-package artifact-level tests in tests/integration/ (a file may also carry lammps; Phase 3 adds the lmp_serial-free ones)",
    "aiida: needs aiida-core; runs against a temporary broker-less SQLite profile (aiida_profile_clean), never the daemon",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/**"]

[tool.pylint.messages_control]
# Gate command (codebase review): pylint src/cli.py src/__init__.py src/core src/run
# src/potentials src/lattice src/builders src/interfaces src/hpc
# Design-size checks are disabled by decision 2026-09-02 (codebase review, "no
# restructuring this round"): each one can only be silenced by splitting a
# function or module. Their hit lists at the time of disabling are recorded
# in docs/superpowers/reviews/findings.md. cyclic-import is deliberately NOT
# here — the one surviving cycle is justified at its site with a module-level
# pragma (src/builders/construction/components.py, mirroring src/lattice/apply.py
# and src/run/expand.py).
#
# duplicate-code IS here, as the spec's end-of-Phase-2 treatment: every
# surviving block is named below, so the gate reaches 0 without hiding what it
# covers. A per-site pragma is not an option — pylint reports R0801 against an
# unrelated module (src/hpc/manifest.py:1 in this tree), so a disable in ONE
# file of a pair never fires; it only works in BOTH, which would mean pragmas
# in ~11 files, i.e. most of src/builders, and no clearer than this list.
#
# COST, stated plainly: this is repo-wide, so a NEW duplication will not be
# reported either. Re-check by running the gate with
# --enable=duplicate-code and diffing against the 13 blocks below.
#
# The 12 surviving blocks (2026-09-09; Task 11's extractions took
# duplicate-code from 18 to 13, then the AFM-2 scan-setup extraction to 12.
# Ranges drift, the symbols do not):
#
#   RULED "leave" -- Task 10 decision row B4-2 and the follow-up ruling of
#   2026-09-09; see docs/superpowers/reviews/builders-sheetonsheet.md (b):
#     1. sheetonsheet.flake_slide FlakeSlideSimulation.build's render context
#        <-> sheetonsheet.hetero HeteroSheetOnSheetSimulation.write_run_scripts'.
#        ~20 shared keys, but they diverge at constraint_mode /
#        reserve_virtual_type / ngroups / num_atom_types / lat_c, and reading
#        the two side by side is how the documented `pressures`-None bug stays
#        fixed in both.
#     2. construction.hetero_stack <-> sheetonsheet.flake_slide: the header of
#        the LAMMPS assembly script f-string (clear/units/atom_style/boundary/
#        region/create_box). Literal LAMMPS input; hoisting half a small
#        template into a helper buys nothing.
#     3. afm.base <-> sheetonsheet.base: five render-context keys that are all
#        straight `sim.<attr>` reads (timestep, thermo, neighbor_list,
#        neigh_modify_command, run_steps).
#     4. construction.hetero_stack._detect_atom_style <-> lattice.apply's copy.
#        LEFT for a hard import-direction reason: builders imports lattice, so
#        lattice cannot import builders back, and builders/utils/lammps_data.py
#        -- the natural home -- is under builders/. A shared home would have to
#        be core/, and core/utils/ is deliberately kept free of LAMMPS-data
#        readers (see that module's own docstring: "every consumer is a
#        builder"). Ten lines of header parsing is not worth inverting that.
#     5. sheetonsheet.base SheetOnSheetSimulation._to_list <->
#        run.expand._as_float_list. Same shape of reason: run/simulate.py
#        imports builders, so builders cannot import run, and a shared home
#        would have to be core/ for a five-line scalar-or-list normalizer.
#        SURFACED by Task 11's deletion of the dead THIRD copy
#        (utils.pes_common._as_float_list, decision row U-1) -- with that gone,
#        pylint pairs the two live ones.
#
#   DEFERRED BY DESIGN -- decided after the queued sheet-provenance task:
#     6. afm.base AFMSimulation._contact_cutoff <-> sheetonsheet.base
#        SheetOnSheetSimulation._contact_cutoff. Extractable as
#        contact_cutoff_from_elements(...) -> (value, source), but the `source`
#        half is exactly what decision row B4-5 is about (the sheet family
#        writes no provenance.json today, so nothing reads it). Extract once
#        that lands, not before.
#
#   RULED "leave" -- builders-afm.md decision row AFM-2, ruled 2026-09-09.
#   All six are afm.base <-> afm.hetero, and all six are the same situation:
#   HeteroAFMSimulation must override rather than extend, because the base
#   builds the substrate inline and the hetero potential spine has
#   sheet_1/sheet_2 where the base has a single 'sheet'. hetero.py's own class
#   docstring already states this ("_build_components is fully overridden (not
#   extended) because the base builds the substrate inline ... re-expressed here
#   rather than by adding a hook to afm.py"). Extraction would mean new hooks in
#   afm/base.py, the file the D2 capstone covers and that 515ffad and 7de895c
#   both changed this session.
#     7-9.   three blocks inside _build_components (the tip/flake build opening,
#            and the tip and sub langevin-region applications).
#     10-11. two blocks inside _generate_potentials (PotentialManager
#            construction; flake + virtual-atom registration).
#     12.    _calculate_z_positions' flake branch -- created DELIBERATELY by
#            515ffad, which mirrored the base's flake branch into the hetero
#            override to fix a KeyError('flake'). Removing this duplication
#            would undo that fix.
#
#   CLOSED since this entry was first written:
#     afm.freestanding <-> afm.pes_tip, write_inputs' PES scan setup --
#     extracted to PESTipSimulation._pes_scan_context (2026-09-09). Both
#     rendered scans proved byte-identical before and after
#     (afm/pes_scan.lmp sha256 ed0b29e0..., 4935 B; afm_freestanding/pes_scan.lmp
#     sha256 0ab958e2..., 2959 B).
disable = [
  "missing-function-docstring",
  "duplicate-code",                  # 12 blocks, all named in the comment above

  "too-many-locals",                 # no-restructuring decision 2026-09-02
  "too-many-arguments",              # no-restructuring decision 2026-09-02
  "too-many-positional-arguments",   # no-restructuring decision 2026-09-02
  "too-many-branches",               # no-restructuring decision 2026-09-02
  "too-many-statements",             # no-restructuring decision 2026-09-02
  "too-many-instance-attributes",    # no-restructuring decision 2026-09-02
  "too-many-nested-blocks",          # no-restructuring decision 2026-09-02
  "too-many-return-statements",      # no-restructuring decision 2026-09-02
  "too-many-public-methods",         # no-restructuring decision 2026-09-02
  "too-many-lines",                  # no-restructuring decision 2026-09-02
]