# Tip PES scan on a freestanding slab (no substrate).
#   FrictionSim2D run pes-tip examples/afm_freestanding_pes_config.ini -o ./pes_output
# No [sub] section selects the freestanding builder: a self-supported N-layer
# slab with layer 1 fixed. Lengths in Angstrom, forces in nN.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
x = 40 # sheet length, Angstrom
y = 40 # sheet width, Angstrom
layers = [4] # slab layers (>= 2; layer 1 is the fixed anchor)
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: settings default, 6)

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 25 # tip radius, Angstrom
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

# No [sub] section: that is what selects the freestanding slab.

[general]
temp = 300 # temperature, K
force = 2 # normal load for the build, nN
scan_speed = 2 # unused by the static scan, m/s
finite_sheet = false # freestanding scans use a periodic sheet

[pes]
grid_n = 12 # N for the N x N lateral grid over one surface cell
tip_load = 5 # load the contact gap calibrates to, nN
eval_mode = minimize # minimize or md
