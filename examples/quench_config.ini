# ------------------------- MELT-QUENCH (amorphous block) -------------------------
# FrictionSim2D run quench examples/quench_config.ini -o ./quench_output
# writes one melt-quench job per member; nothing runs until you submit it
# (FrictionSim2D hpc generate ROOT, or add --local), then
# FrictionSim2D quench import ROOT adds the blocks to the library.
#
# Every condition left unset comes from settings.yaml `quench`; a list makes one
# member per value (material x every listed condition). The defaults reproduce the
# shipped amorphous Si block, so this config, unchanged, finds it present.

[quench]
material  = Si                                   # list allowed: [Si, Ge]
potential = examples/potentials/sw/{mat}.sw      # {mat} is replaced per material
pot_type  = sw
cif       = examples/materials/{mat}.cif         # default <mat>.cif
slab      = [200, 200, 50]                       # crystal slab to melt, Angstrom
quench_rate = 1e12                               # K/s
# melt_temp = 2500                               # K
# quench_temp = 300                              # K
# timestep = 0.002                               # ps
# melt_steps = 20000
# equilibrate_steps = 10000
