# AFM friction with a shaped flake between the tip and the sheet.
#   FrictionSim2D run afm examples/afm_flake_config.ini -o ./afm_output
# As afm_config.ini, plus [flake]: a finite triangle/square/hexagon cut from its
# own material. Its corner atoms are tethered in xy during indentation, then
# released for sliding. Lengths in Angstrom, forces in nN, speeds in m/s.

[2D]
mat = MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
x = 100 # sheet length, Angstrom
y = 100 # sheet width, Angstrom
layers = [1] # layer counts; a list sweeps
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: settings default, 6)

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 25 # tip radius, Angstrom
dspring = 1.6e-6 # tip damper
tip_x = # tip x position, Angstrom (blank: centred)
tip_y = # tip y position, Angstrom (blank: centred)
tip_x_offset = 0.0 # x shift from the centre when tip_x is blank, Angstrom
tip_y_offset = 0.0 # y shift from the centre when tip_y is blank, Angstrom
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

[sub]
mat = Si # substrate material
amorph = a # a = amorphous substrate (required when finite_sheet = false)
thickness = 12 # substrate thickness, Angstrom
x = 140 # substrate length, Angstrom (finite_sheet = true only)
y = 140 # substrate width, Angstrom (finite_sheet = true only)
pot_path = potentials/sw/Si.sw # substrate potential file
pot_type = sw # substrate potential type
cif_path = materials/Si.cif # substrate structure (CIF)

[flake]
mat = MoS2 # flake material
cif_path = materials/h-MoS2.cif # flake structure (CIF)
pot_path = potentials/sw/MoS2_wen.sw # flake potential file
pot_type = sw # flake potential type
shape = hexagon # triangle, square or hexagon
edge_length = 30 # side length (hexagon: circumradius), Angstrom
rotation_deg = 0.0 # in-plane rotation, degrees, counter-clockwise
corner_radius = 5.0 # capture radius for corner atoms, Angstrom
corner_spring_k = 10.0 # corner xy tether during indentation, eV/Angstrom^2
# x = # carving supercell length, Angstrom (blank: auto)
# y = # carving supercell width, Angstrom (blank: auto)
# center_x = # flake centre x, Angstrom (blank: under the tip)
# center_y = # flake centre y, Angstrom (blank: under the tip)

[general]
temp = 300 # temperature, K
force = [5,20,50] # normal loads, nN
scan_angle = 0 # scan direction, degrees
driving_spring = 50 # driving spring constant, N/m
scan_speed = 2 # tip scan speed, m/s
finite_sheet = false # true: a finite sheet on the [sub] x/y substrate
