# Melt-quench: make an amorphous block for the library.
#   FrictionSim2D run quench examples/quench/basic.ini -o ./quench_output
# Writes one melt-quench job per member; nothing runs until it is submitted
# (FrictionSim2D hpc generate ROOT). FrictionSim2D quench import ROOT then adds
# the blocks to the library. Unset conditions come from settings.yaml `quench`;
# a list makes one member per value. The defaults reproduce the packaged
# amorphous Si block, so this config, unchanged, finds it present.

[quench]
material = Si # material(s) to quench; a list is allowed, e.g. [Si, Ge]
potential = potentials/sw/{mat}.sw # potential file; {mat} is replaced per material
pot_type = sw # potential type
cif = materials/{mat}.cif # crystal structure (default <mat>.cif)
slab = [200, 200, 50] # crystal slab to melt, Angstrom
quench_rate = 1e12 # cooling rate, K/s
# melt_temp = 2500 # melt temperature, K
# quench_temp = 300 # final temperature, K
# timestep = 0.002 # timestep, ps
# melt_steps = 20000 # melt run, steps
# equilibrate_steps = 10000 # final relax run, steps
