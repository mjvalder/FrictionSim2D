# Sheet-on-sheet PES scan: a static N x N map of the interlayer energy.
#   FrictionSim2D run pes-sheet examples/pes-sheet/basic.ini -o ./pes_output
# The sheet-on-sheet geometry with the sliding run replaced by a lateral scan
# over one surface cell. Lengths in Angstrom.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
x = 30 # sheet length, Angstrom (> 2 x the LJ cutoff, about 24)
y = 30 # sheet width, Angstrom
layers = [2] # a frozen bottom layer and a scanned top layer
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: relax to equilibrium)

[general]
temp = 0 # unused by the static scan, K

[pes]
grid_n = 12 # N for the N x N lateral grid over one surface cell
grid_n_refine = 20 # finer grid for a convergence check (blank: skip)
z_relax = true # relax the top layer's z at each grid point
