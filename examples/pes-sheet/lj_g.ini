# Sheet-on-sheet PES scan with the lj_g interlayer style (LJ plus the Jiang-Park Gaussian).
#   FrictionSim2D run pes-sheet examples/pes-sheet/lj_g.ini -o ./pes_output
# As basic.ini plus [general] interlayer_style: the scan maps whichever
# interlayer interaction the run uses (lj, lj_g, ilp, kc). Lengths in Angstrom.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
x = 30 # sheet length, Angstrom (> 2 x the LJ cutoff, about 24)
y = 30 # sheet width, Angstrom
layers = [2] # a frozen bottom layer and a scanned top layer
stack_type = AB # layer stacking: AB or AA

[general]
temp = 0 # unused by the static scan, K
interlayer_style = lj_g # lj, lj_g, ilp or kc (kc: carbon only)

[pes]
grid_n = 3 # N for the N x N lateral grid (small, for a quick scan)
z_relax = true # relax the top layer's z at each grid point
