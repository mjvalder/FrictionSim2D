# Indentation over every material in material_list.txt.
#   FrictionSim2D run indent examples/indent_campaign.ini -o <out> --hpc-scripts
#   FrictionSim2D postprocess indent <out>/simulation_* --out-dir outputs/poke_sims --data-dir data
# Loads loop inside each script (outer_loop unset): one script per
# (material, layer). Lengths in Angstrom, forces in nN.

[2D]
materials_list = examples/material_list.txt # one material per line (path from the repo root)
mat = {mat} # replaced by each listed material
cif_path = materials/{mat}.cif # sheet structure per material
pot_path = potentials/sw/sw_lammps/{mat}.sw # sheet potential per material
pot_type = sw # potential type
x = 60 # sheet length, Angstrom
y = 60 # sheet width, Angstrom
layers = [1, 2] # layer counts
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: settings default, 6)

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 15 # tip radius, Angstrom (4 r = the 60 Angstrom sheet the 2x-diameter rule needs)
dspring = # tip damper (blank: automatic)
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

[sub]
mat = Si # substrate material
amorph = a # a = amorphous substrate
thickness = 12 # substrate thickness, Angstrom
pot_path = potentials/sw/Si.sw # substrate potential file
pot_type = sw # substrate potential type
cif_path = materials/Si.cif # substrate structure (CIF)

[general]
temp = 300 # temperature, K
force = [5, 10, 20, 30] # normal loads, nN
scan_speed = 2 # unused by hold/retract, m/s
finite_sheet = false # true: a finite sheet on the [sub] x/y substrate
