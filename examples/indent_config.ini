# AFM indentation: press to each load, hold, then retract to pull-off. No sliding.
#   FrictionSim2D run indent examples/indent_config.ini -o ./indent_output --hpc-scripts
#   FrictionSim2D postprocess indent ./indent_output/simulation_* --out-dir outputs/poke_sims --data-dir data
# The damped finite-T hold records the out-of-plane penetration; the rigid tip
# is then retracted quasi-statically (T = 0) for the pull-off force, work of
# adhesion and contact stiffness. Lengths in Angstrom, forces in nN.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
x = 60 # sheet length, Angstrom (well beyond the tip contact)
y = 60 # sheet width, Angstrom
layers = [1, 2] # layer counts: a monolayer and a bilayer
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: relax to equilibrium)

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 15 # tip radius, Angstrom (60 x 60 sheet = 2 x tip diameter)
dspring = # tip damper (blank: automatic damping for the hold)
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

[sub]
mat = Si # substrate material
amorph = a # a = amorphous substrate (required unless finite_sheet)
thickness = 12 # substrate thickness, Angstrom
pot_path = potentials/sw/Si.sw # substrate potential file
pot_type = sw # substrate potential type
cif_path = materials/Si.cif # substrate structure (CIF)

[general]
temp = 300 # temperature of the indentation and hold, K
force = [5, 10, 20, 30, 50] # normal loads, nN
scan_angle = 0 # scan direction, degrees (labels only; nothing slides)
scan_speed = 2 # unused by hold/retract, m/s
outer_loop = force # one HPC job per load
finite_sheet = false # true: a finite sheet on the [sub] x/y substrate

[indent]
hold_steps = 10000 # damped hold at the target load, steps (10 ps)
z_step = 0.2 # retract increment, Angstrom
n_steps = 100 # retract steps (n_steps x z_step = 20 Angstrom)
seed = 20260710 # base seed; each (material, layer) derives its own, recorded in the manifest
