# Sheet-on-sheet MoS2 under three interlayer interactions, measured the same way.
#   FrictionSim2D run sheetonsheet examples/sheet_config_interlayer.ini -o ./out
# One build, three run directories (il-lj-cmp, il-ljg-cmp, il-ilp-cmp):
#   lj    the run's Lennard-Jones (UFF, or [lj_override] below)
#   lj_g  that LJ plus the Jiang-Park Gaussian (g = 175.68 meV for MoS2;
#         [2D] interlayer_g changes it)
#   ilp   the Ouyang ilp/tmd potential (packaged potentials/ilp/TMD.ILP)
#   kc    Kolmogorov-Crespi, carbon only (packaged potentials/kc/CC.KC-full)
# Lengths in Angstrom, pressure in GPa, speeds in m/s.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
pot_path = potentials/sw/MoS2_sevik.sw # sheet potential file
pot_type = sw # potential type
x = 40 # sheet length, Angstrom (> the 16 Angstrom ilp cutoff + skin)
y = 40 # sheet width, Angstrom
layers = [3] # the sheet-on-sheet minimum: two MoS2/MoS2 interfaces
stack_type = AB # layer stacking: AB or AA
lat_c = 6.15 # interlayer spacing, Angstrom (bulk 2H-MoS2; blank minimises per style)

[general]
temp = 0 # temperature, K
pressure = 1 # normal pressure, GPa
scan_angle = 0 # sliding direction, degrees
scan_speed = 1 # sliding speed, m/s
driving_spring = 50 # driving spring constant, N/m
interlayer_style = [lj, lj_g, ilp] # a sweep: one run directory per style (token il-<style>)
interlayer_comparison = true # every style reports the bottom-layer reaction force as friction

# [lj_override]
# Jiang & Park's MoS2 interlayer LJ (J. Appl. Phys. 117, 124304 (2015), Table II)
# instead of UFF; with it lj_g reproduces their LJ + Gaussian model.
# S-S = [0.0236, 3.18] # [epsilon (eV), sigma (Angstrom)]
