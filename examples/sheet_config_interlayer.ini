################################################################################
# Sheet-on-sheet MoS2: compare the interlayer interaction styles
################################################################################
# One build, three run directories (il-lj-cmp, il-ljg-cmp, il-ilp-cmp), each measuring
# friction the same way. Run with:
#   FrictionSim2D run sheetonsheet examples/sheet_config_interlayer.ini -o ./out
#
#   lj    the run's normal Lennard-Jones (UFF, or [lj_override] below)
#   lj_g  that LJ plus the Jiang-Park Gaussian g*exp(-rho^2) (g = 175.68 meV
#         for MoS2; set [2D] interlayer_g to change it)
#   ilp   the Ouyang ilp/tmd interlayer potential (bundled TMD.ILP)
#   kc    Kolmogorov-Crespi, carbon only (bundled CC.KC-full; no MoS2 parameters)

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2
cif_path = examples/materials/h-MoS2.cif
pot_path = examples/potentials/sw/MoS2_sevik.sw
pot_type = sw
# ilp's cutoff is 16 A: the build refuses a cell whose in-plane widths are not
# above 16 A + the neighbor skin. 40 x 40 clears it with room to spare.
x = 40 # length of sheet in Angstrom
y = 40 # width of sheet in Angstrom
# Three layers, the sheet-on-sheet minimum (a fixed bottom, a mobile
# thermostatted middle, a rigid driven top): two MoS2/MoS2 interfaces.
layers = [3]
stack_type = AB # AB or AA
# Bulk 2H-MoS2 spacing. Leave blank to minimise it under each style instead
# (each run then starts at its own style's equilibrium spacing).
lat_c = 6.15 # interlayer spacing in Angstrom

# ----------------------- General -----------
[general]
temp = 0 # in K
pressure = 1 # in GPa
scan_angle = 0 # in degrees
scan_speed = 1 # scan speed m/s
driving_spring = 50 # spring constant in N/m
# A sweep: one run directory per style (directory token il-<style>).
interlayer_style = [lj, lj_g, ilp]
# Comparison mode: every style reports the bottom-layer reaction force as the
# friction (compute group/group cannot evaluate ILP or LJ-G's Gaussian), so
# the three runs measure the same quantity the same way. Adds a directory token.
interlayer_comparison = true

# ----------------------- LJ override -------
# Uncomment to give lj and lj_g Jiang & Park's MoS2 interlayer LJ
# (J. Appl. Phys. 117, 124304 (2015), Table II) instead of UFF: with it, lj_g
# reproduces their LJ + Gaussian model exactly. [epsilon (eV), sigma (A)].
# [lj_override]
# S-S = [0.0236, 3.18]
