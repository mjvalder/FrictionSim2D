# AFM friction: a tip sliding on a supported 2D sheet.
#   FrictionSim2D run afm examples/afm_config.ini -o ./afm_output
# Lengths in Angstrom, forces in nN, speeds in m/s. materials/... and
# potentials/... name files in the packaged library (frictionsim2d/data).

[2D]
mat = MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
# Material sweep: replace mat, cif_path and pot_path with
#   materials_list = examples/material_list.txt
#   mat = {mat}
#   cif_path = materials/{mat}.cif
#   pot_path = potentials/sw/sw_lammps/{mat}.sw
x = 100 # sheet length, Angstrom
y = 100 # sheet width, Angstrom
layers = [1,2,3] # layer counts; a list sweeps, one run directory each
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type: sw, tersoff, rebomos, reaxff, ...
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: settings default, 6)

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 25 # tip radius, Angstrom
dspring = 1.6e-6 # tip damper
tip_x = # tip x position in box coordinates, Angstrom (blank: centred)
tip_y = # tip y position in box coordinates, Angstrom (blank: centred)
tip_x_offset = 0.0 # x shift from the centre when tip_x is blank, Angstrom
tip_y_offset = 0.0 # y shift from the centre when tip_y is blank, Angstrom
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

[sub]
mat = Si # substrate material
amorph = a # a = amorphous substrate (the packaged amor_Si block); blank = crystalline
thickness = 12 # substrate thickness, Angstrom
x = 140 # substrate length, Angstrom (finite_sheet = true only)
y = 140 # substrate width, Angstrom (finite_sheet = true only)
pot_path = potentials/sw/Si.sw # substrate potential file
pot_type = sw # substrate potential type
cif_path = materials/Si.cif # substrate structure (CIF)

[general]
temp = 300 # temperature, K
find = 5 # load the tip is first pressed to, nN
force = [2,5,10,20,30,50,70,85,100] # normal loads, nN
scan_angle = [2, 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50, 54, 58, 62, 66, 70, 74, 78, 82, 86, 90] # scan directions, degrees, ascending (one script loops them)
scan_angle_force = 30 # the load the angle loop runs at, nN; one of force
driving_spring = 50 # driving spring constant, N/m
scan_speed = 2 # tip scan speed, m/s
finite_sheet = false # true: a finite sheet on the [sub] x/y substrate
# finite_sheet_afm_edge_mode = spring # finite-sheet edge restraint: spring or none
# finite_sheet_edge_spring_k = 10.0 # edge spring constant, eV/Angstrom^2
