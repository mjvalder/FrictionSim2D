################################################################################
# ------------------------------- USER INPUTS -------------------------------- #
################################################################################

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2 # Material ID "mp-2815" MoS2 "mp-1634" MoSe2
cif_path = examples/materials/h-MoS2.cif
x = 100 # length of sheet in Angstrom
y = 100 # width of sheet in Angstrom
layers = [3] # SheetOnSheetSimulation.MIN_LAYERS: a fixed bottom, a mobile
             # thermostatted middle, and a rigid driven top
pot_path = examples/potentials/sw/MoS2_wen.sw # potential path
# For a material sweep, replace mat/cif_path/pot_path above with:
#   materials_list = examples/material_list.txt
#   mat = {mat}
#   cif_path = examples/materials/{mat}.cif
#   pot_path = examples/potentials/sw/sw_lammps/{mat}.sw
pot_type = sw
stack_type = AB # AB or AA
lat_c =  # lattice constant in Angstrom (default is 6)

# ----------------------- General -----------
[general]
temp = 0 # in K
pressure = [-0.5, -0.1, 0.01, 0.05,0.1,0.5, 0.8, 1, 5, 10, 20, 50, 100] # in GPa
# Scan angles in degrees, ascending, or a single value. There is no
# [lower, upper, interval, force] spec form -- list the angles. They loop inside
# one script, so the list does not multiply the output directories.
scan_angle = [0, 30, 60, 90]
bond_spring = 5 # in eV/A^2 (5 is default)
scan_speed = 1 # scan speed m/s
driving_spring = 50 # spring constant in N/m