# A two-material flake (MoS2 under WS2) sliding on a MoS2 bilayer.
#   FrictionSim2D run sheetonsheet examples/sheetonsheet/flake_slide_hetero.ini -o ./sheet_output
# [Flake] keeps only the shape; [Flake-1], [Flake-2] give the flake layers,
# bottom first, each cut to that shape. Building runs lmp_serial to relax the coincidence cell.
# Lengths in Angstrom, pressure in GPa, speeds in m/s.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
x = 24 # sheet length, Angstrom
y = 24 # sheet width, Angstrom
layers = [2] # sheet layers under the flake
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
stack_type = AB # layer stacking: AB or AA

[Flake]
shape = hexagon # triangle, square or hexagon
edge_length = 5.0 # side length (hexagon: circumradius), Angstrom
corner_radius = 3.5 # capture radius for corner atoms, Angstrom
corner_spring_k = 10.0 # corner xy tether while loading, eV/Angstrom^2

[Flake-1]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
x = 12 # sheet length, Angstrom
y = 12 # sheet width, Angstrom
layers = [1] # layers of this flake material
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
stack_type = AB # layer stacking: AB or AA

[Flake-2]
mat = h-WS2 # material name, used in output directory names
cif_path = materials/h-WS2.cif # sheet structure (CIF)
x = 12 # sheet length, Angstrom
y = 12 # sheet width, Angstrom
layers = [1] # layers of this flake material
pot_path = potentials/sw/sw_lammps/h-WS2.sw # sheet potential file
pot_type = sw # potential type
stack_type = AB # layer stacking: AB or AA

[general]
temp = 300 # temperature, K
pressure = 0.1 # normal pressure, GPa
scan_speed = 100 # sliding speed, m/s (high, for a short test run)
driving_spring = 50 # driving spring constant, N/m
