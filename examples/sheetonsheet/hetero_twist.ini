# Twisted MoS2/WS2 heterostructure: the top sheet rotated against the bottom one.
#   FrictionSim2D run sheetonsheet examples/sheetonsheet/hetero_twist.ini -o ./sheet_output
# [2D-1] is the bottom material, [2D-2] the top; twist_angle picks the
# coincidence cell nearest that angle (within twist_angle_tol). Building runs lmp_serial to relax the coincidence cell.
# Lengths in Angstrom, pressure in GPa, speeds in m/s.

[2D-1]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
x = 12 # sheet length, Angstrom
y = 12 # sheet width, Angstrom
layers = [2] # layers of this material
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
pot_type = sw # potential type
stack_type = AB # layer stacking: AB or AA
lat_c = 6.15 # interlayer spacing of this material, Angstrom

[2D-2]
mat = h-WS2 # material name, used in output directory names
cif_path = materials/h-WS2.cif # sheet structure (CIF)
x = 12 # sheet length, Angstrom
y = 12 # sheet width, Angstrom
layers = [2] # layers of this material
pot_path = potentials/sw/sw_lammps/h-WS2.sw # sheet potential file
pot_type = sw # potential type
stack_type = AB # layer stacking: AB or AA
lat_c = 6.2 # interlayer spacing of this material, Angstrom

[general]
temp = 300 # temperature, K
pressure = 0.1 # normal pressure, GPa
scan_speed = 1 # sliding speed, m/s
driving_spring = 50 # driving spring constant, N/m
twist_angle = 21.8 # target twist between the two materials, degrees
twist_angle_tol = 5 # accepted deviation from twist_angle, degrees
