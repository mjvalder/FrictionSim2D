# Sheet-on-sheet friction with ReaxFF, swept over two sliding speeds.
#   FrictionSim2D run sheetonsheet examples/sheetonsheet/reaxff_speed_sweep.ini -o ./sheet_output
# pot_type = reaxff carries its own interlayer terms, so no LJ is added;
# scan_speed = [...] gives one run directory per speed.
# Lengths in Angstrom, pressure in GPa, speeds in m/s.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
x = 24 # sheet length, Angstrom
y = 24 # sheet width, Angstrom
layers = [3] # at least 3: fixed bottom, thermostatted middle, rigid driven top
pot_path = potentials/reaxff/ffield_ost.reax.MoS # sheet potential file
pot_type = reaxff # potential type
stack_type = AB # layer stacking: AB or AA
lat_c = 6.15 # interlayer spacing of this material, Angstrom

[general]
temp = 300 # temperature, K
pressure = 0.1 # normal pressure, GPa
scan_angle = 0 # sliding direction, degrees
scan_speed = [1, 2] # sliding speeds, m/s; a list sweeps
driving_spring = 50 # driving spring constant, N/m
