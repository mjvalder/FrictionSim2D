# Sheet-on-sheet friction: a driven top layer sliding over the sheet below.
#   FrictionSim2D run sheetonsheet examples/sheetonsheet/basic.ini -o ./sheet_output
# Lengths in Angstrom, pressure in GPa, speeds in m/s.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
x = 100 # sheet length, Angstrom
y = 100 # sheet width, Angstrom
layers = [3] # at least 3: fixed bottom, thermostatted middle, rigid driven top
pot_path = potentials/sw/MoS2_wen.sw # sheet potential file
# Material sweep: replace mat, cif_path and pot_path with
#   materials_list = examples/lists/material_list.txt
#   mat = {mat}
#   cif_path = materials/{mat}.cif
#   pot_path = potentials/sw/sw_lammps/{mat}.sw
pot_type = sw # potential type
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: settings default, 6)

[general]
temp = 0 # temperature, K
pressure = [-0.5, -0.1, 0.01, 0.05,0.1,0.5, 0.8, 1, 5, 10, 20, 50, 100] # normal pressures, GPa
scan_angle = [0, 30, 60, 90] # sliding directions, degrees, ascending (one script loops them)
bond_spring = 5 # bond spring constant, eV/Angstrom^2
scan_speed = 1 # sliding speed, m/s
driving_spring = 50 # driving spring constant, N/m
