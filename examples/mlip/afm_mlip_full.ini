# ---------------------------------------------------------------------------
# AFM (tip + sheet + substrate), FULL-CELL MLIP (DeePMD).
#
# This is the topology v4 §6 recorded as UNREACHABLE and v6 unblocks
# (docs/superpowers/specs/2026-09-03-mlip-multicomponent-fullcell-design.md).
# The builders used to register one MLIP instance PER COMPONENT with NULL-padded
# type maps, which both frameworks reject. They now emit ONE instance whose map
# spans every atom type in the cell:
#
#   pair_style hybrid/overlay deepmd <model> dispersion/d3 bj pbe 16.0 8.0
#   pair_coeff * * deepmd Si Si Si Si Si Si Mo Mo Mo S S S Mo  # sub, tip, sheet
#   pair_coeff * * dispersion/d3 Si Si Si Si Si Si Mo Mo Mo S S S Mo
#
# (13 types: sub Si x3 and tip Si x3 -- Langevin splits each component into
#  mobile/fix/thermo -- then the 3-layer sheet as Mo(L1..L3), S(L1..L3), then
#  the virtual drive atom, which takes the framework's placeholder element and
#  is removed from the neighbour list by `neigh_modify exclude`.)
#
# THREE RULES THIS FILE EXISTS TO DEMONSTRATE
#
# 1. EVERY COMPONENT MUST USE THE SAME MLIP. An SW tip beside a DeePMD sheet is
#    refused at generation time, not emitted: one `pair_coeff * *` claims every
#    atom type, so the classical component's types would be silently absorbed.
#    The whole cell is one MLIP, or the whole cell is classical.
#
# 2. THE SUBSTRATE MUST BE CRYSTALLINE AND LATTICE-MATCHED (`amorph = c` +
#    `match = true`). The shipped classical AFM examples use `amorph = a`, but
#    amorphisation is a melt-quench MD run performed at GENERATION time, and it
#    can evaluate neither the `pair_style zero` build surrogate (no forces) nor
#    the MLIP (which would need an MLIP-enabled LAMMPS in every generation
#    environment and in CI). `amorph = a` under an MLIP is refused with an error
#    naming v6 §5. A lattice-matched crystalline substrate is the supported
#    route -- AFMSimulationConfig accepts either form.
#
# 3. THE MODEL MUST COVER EVERY ELEMENT IN THE CELL -- here Si, Mo and S.
#    `dpa3_alex2d.pth` is the 2D-materials head: it has seen Si, but only inside
#    2D materials, NOT as the bulk/amorphous Si an AFM asperity is made of. Use a
#    BULK-MATERIALS head for any tip-bearing cell:
#      dp --pt freeze -c DPA-3.2-5M.pt --head OMat24 -o dpa32_omat24.pth
#    (OMat24 is DPA-3.2's default head; MPTrj is the same dataset MACE-MP-0 was
#     trained on, so the two make a real cross-framework check.)
#    For MACE, re-extract with every element:
#      symmetrix_extract_mace -m mace-mpa-0-medium.model -s Si Mo S -o <out>.json
#    Naming an element the model lacks does NOT error at run time -- LAMMPS maps
#    those types to the model's first N elements and returns a plausible, WRONG
#    energy (v4 E7). MACE models are checked for this at generation time; DeePMD
#    type maps live inside the serialized .pth and cannot be, so verify by
#    running the reference cell.
#
# SCOPE: all-MLIP AFM is a small-cell VALIDATION REFERENCE, not a production
# mode (v5 §7/§8). Production AFM goes through ML-MIX force mixing. Keep the
# cell small.
#
# Run with:
#   FrictionSim2D run afm examples/mlip/afm_mlip_full.ini -o ./out
# ---------------------------------------------------------------------------

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2
cif_path = materials/h-MoS2.cif
x = 30 # small: this is a reference cell, not a production run
y = 30
layers = [3]
pot_path = ../models/dpa32_omat24.pth
pot_type = deepmd
stack_type = AB
# D3 is MANDATORY for a multilayer MLIP stack -- the bare model has no
# interlayer binding. Needs a binary carrying deepmd AND dispersion/d3.
dispersion = d3
lat_c = 6.112 # INTERLAYER distance (A), not the in-plane 3.16

# ----------------------- Tip ---------------
[tip]
mat = Si
amorph =  # crystalline: see rule 2 above
r = 15 # small tip to keep the reference cell affordable
dspring = 1.6e-6
pot_path = ../models/dpa32_omat24.pth # SAME model as every other component
pot_type = deepmd
cif_path = materials/Si.cif

# ----------------------- Substrate ---------
[sub]
mat = Si
amorph = c # NOT 'a' -- see rule 2 above
match = true # lattice-matched, which is what makes amorph = c legal here
thickness = 12
pot_path = ../models/dpa32_omat24.pth # SAME model as every other component
pot_type = deepmd
cif_path = materials/Si.cif

# ----------------------- General -----------
[general]
temp = 300 # in K
find = 5 # in nN
force = [10] # in nN -- AFM is FORCE-controlled (sheet-on-sheet is pressure)
scan_angle = 0
driving_spring = 50 # spring constant in N/m
scan_speed = 2 # m/s
finite_sheet = false
