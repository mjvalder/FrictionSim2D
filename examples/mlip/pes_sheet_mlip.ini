# ---------------------------------------------------------------------------
# Interlayer PES scan (static corrugation map) with FULL-CELL DeePMD.
#
# Capability-matrix row (docs/superpowers/specs/2026-08-11-mlip-post-m0-design.md
# §3): Full-cell DeePMD base = YES (executed, E1). Full-cell + D3 needs a LAMMPS
# binary carrying both `pair_style deepmd` and `dispersion/d3` (§4). MACE is
# untested on this stack.
#
# Static single-point scans are the cheapest MLIP runs in the package: no
# sliding, no drive atom in the scanned phase, and a bilayer is one component --
# so this is the least constrained MLIP case there is. (Multi-component cells --
# AFM, hetero, flake -- are NOT available: the builders would emit one instance
# per component with NULL-padded type maps, which both frameworks reject. See
# spec §6.)
#
# The PES sheet builder requires EXACTLY 2 layers (a frozen bottom + a rigid,
# laterally scanned top) -- PESSheetSimulation.MIN_LAYERS = 2.
#
# Run with:
#   FrictionSim2D run pes-sheet examples/mlip/pes_sheet_mlip.ini -o ./pes_out
# ---------------------------------------------------------------------------

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2
cif_path = materials/h-MoS2.cif
# A few unit cells is enough and cheapest for a static PES; MLIP inference cost
# scales with atoms x neighbours, so keep this small.
x = 30 # length of sheet in Angstrom
y = 30 # width of sheet in Angstrom
layers = [2] # exactly 2: frozen bottom + laterally scanned top
# DeePMD frozen model (.pb/.pth): DPA-3.1-3M frozen at the Alexandria-2D head
# with `dp --pt freeze -c <checkpoint> --head Alex2D -o dpa3_alex2d.pth`.
pot_path = ../models/dpa3_alex2d.pth
pot_type = deepmd
stack_type = AB # AB or AA
# D3 is MANDATORY for a multilayer MLIP stack. Measured 2026-08-11 on
# DPA-3.1-3M/Alex2D: the bare model has NO interlayer binding (no minimum,
# 5.7e-7 J/m^2). With D3: 6.112 A / 0.265 J/m^2, within 0.6% of experiment.
# Needs a binary carrying deepmd AND dispersion/d3 --
# scripts/hpc/build_lammps_deepmd_d3.sh builds one.
dispersion = d3
                  # reshapes the corrugation
# INTERLAYER distance in Angstrom -- NOT the in-plane lattice constant (~3.16 A
# for MoS2). Blank ("relax to equilibrium") is NOT available for MLIP sheets:
# stacking runs under a `pair_style zero` surrogate, so nothing can minimize it.
# Use scripts/mlip_bilayer_benchmark.py.
lat_c = 6.112 # INTERLAYER distance (A): measured DPA-3.1/Alex2D + D3 equilibrium (exp. 6.15)

# ----------------------- General -----------
[general]
temp = 0 # unused by the static scan (no dynamics/thermostat)

# ----------------------- PES scan ----------
[pes]
grid_n = 12 # N for the N x N lateral grid over one surface unit cell
grid_n_refine = # optional finer grid for a convergence check (blank to skip)
z_relax = false # false = rigid scan; a relaxed PES multiplies the MLIP cost
