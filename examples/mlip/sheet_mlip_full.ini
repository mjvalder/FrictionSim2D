# ---------------------------------------------------------------------------
# Sheet-on-sheet, FULL-CELL MLIP (DeePMD).
#
# Capability-matrix row (docs/superpowers/specs/2026-08-11-mlip-post-m0-design.md
# §3 -- the binding matrix):
#   Full-cell, DeePMD base = YES, executed (E1: trilayer, E_pair = -256.90309 eV)
#   Full-cell, DeePMD + D3 = mechanism fine, but needs a LAMMPS binary carrying
#                            BOTH `pair_style deepmd` and `dispersion/d3`
#                            (see §4 / scripts/hpc). Set `dispersion = d3` only
#                            with such a build.
#   MACE                   = built and measured (documentation/mlip.md footnote 3 and
#                            the section 3 traps): swap `pot_type = mace` plus a
#                            symmetrix `.json` model (extracted with
#                            `symmetrix_extract_mace -m <model> --chemical-symbols Mo S`).
#                            A `.model-lammps.pt` is the ACEsuit fork's format
#                            and is REJECTED here.
#
# Full-cell is the ONLY supported topology. The struck alternative -- one MLIP
# instance per layer with explicit interlayer `lj/cut` -- needs a NULL-padded
# type map, and `pair_deepmd` refuses it:
#   pair_coeff * * deepmd Mo S NULL NULL  -> ERROR: Pair hybrid sub-style
#                                           deepmd is not used
#   pair_coeff 1*2 1*2 deepmd Mo S        -> deepmd requires that the scale be
#                                           set to all atom types, i.e.
#                                           pair_coeff * *   (pair_deepmd.cpp:816)
# Overlaying LJ on a full-cell MLIP is rejected on physics, not mechanics: the
# model's cutoff already spans the interlayer gap, so a UFF-mixed LJ meant to BE
# the interlayer potential double-counts. `dispersion = d3` is the vdW lever.
#
# Emits a single deepmd instance spanning every sheet type and NO lj/cut between
# layers (the model supplies the interlayer physics):
#   pair_style deepmd <model>
#   pair_coeff * * Mo Mo Mo S S S      # sheet
# (atom types are ELEMENT-first: 1-3 = Mo of layers 1-3, 4-6 = S of layers 1-3)
# NEVER shorten that to `pair_coeff * * deepmd` with no element list: LAMMPS does
# not error, it maps the types to the model's first N elements (H, He, Li, ...)
# and quietly returns the wrong energy (-61.89 eV vs -256.90 eV on the reference
# trilayer).
#
# Run with:
#   FrictionSim2D run sheetonsheet examples/mlip/sheet_mlip_full.ini -o ./out
# ---------------------------------------------------------------------------

# ----------------------- 2D Sheet ----------
[2D]
mat = h-MoS2
cif_path = examples/materials/h-MoS2.cif
x = 30 # length of sheet in Angstrom
y = 30 # width of sheet in Angstrom
layers = [3] # sheet-on-sheet needs >= 3 layers (SheetOnSheetSimulation.MIN_LAYERS)
# DeePMD frozen model (.pb/.pth). DPA-3.1-3M frozen at the Alexandria-2D head:
#   dp --pt freeze -c <checkpoint> --head Alex2D -o dpa3_alex2d.pth
# (a bare `dp freeze` fails on a DPA model -- it is multitask, so --head is
#  mandatory). The file is multi-GB and lives outside the repo.
pot_path = ../models/dpa3_alex2d.pth
pot_type = deepmd
stack_type = AB # AB or AA
# D3 is MANDATORY for a multilayer MLIP stack. Measured 2026-08-11 on
# DPA-3.1-3M/Alex2D: the bare model has NO interlayer binding (no minimum,
# 5.7e-7 J/m^2). With D3: 6.112 A / 0.265 J/m^2, within 0.6% of experiment.
# Needs a binary carrying deepmd AND dispersion/d3 --
# scripts/hpc/build_lammps_deepmd_d3.sh builds one.
dispersion = d3
# INTERLAYER distance in Angstrom -- NOT the in-plane lattice constant (that is
# ~3.16 A for MoS2 and is never written here). Mandatory for MLIP pot_types
# because MLIP stacking runs under a `pair_style zero` surrogate and so cannot
# minimize one. From scripts/mlip_bilayer_benchmark.py
# (`equilibrium_separation_A`). A value smaller than the model's equilibrium is
# the "dome plow" failure mode.
lat_c = 6.112 # INTERLAYER distance (A): measured DPA-3.1/Alex2D + D3 equilibrium (exp. 6.15)

# ----------------------- General -----------
[general]
temp = 0 # in K
pressure = [0.1, 1, 5] # in GPa -- sheet-on-sheet is PRESSURE-controlled
scan_angle = 0 # single sliding direction, in degrees
scan_speed = 1 # scan speed m/s
driving_spring = 50 # spring constant in N/m
