# Tip PES scans on freestanding slabs, over every material in material_list.txt.
#   FrictionSim2D run pes-tip examples/afm_freestanding_pes_campaign.ini -o <out> --hpc-scripts
#   FrictionSim2D postprocess pes-scan <out>/simulation_* --data-dir data
# No [sub] section: each member uses the freestanding builder. Lengths in
# Angstrom, forces in nN.

[2D]
materials_list = examples/material_list.txt # one material per line (path from the repo root)
mat = {mat} # replaced by each listed material
cif_path = materials/{mat}.cif # sheet structure per material
pot_path = potentials/sw/sw_lammps/{mat}.sw # sheet potential per material
pot_type = sw # potential type
x = 60 # sheet length, Angstrom (>= 2 x tip diameter + scan travel)
y = 60 # sheet width, Angstrom
layers = [4] # slab layers (>= 2; layer 1 is the fixed anchor)
stack_type = AB # layer stacking: AB or AA
lat_c = # interlayer spacing, Angstrom (blank: settings default, 6)

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 25 # tip radius, Angstrom
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

# No [sub] section: freestanding.

[general]
temp = 300 # temperature, K
force = 2 # normal load for the build, nN
scan_speed = 2 # unused by the static scan, m/s
finite_sheet = false # freestanding scans use a periodic sheet

[pes]
grid_n = 12 # N for the N x N lateral grid over one surface cell
tip_load = 5 # load the contact gap calibrates to, nN
eval_mode = minimize # minimize or md
