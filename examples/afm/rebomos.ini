# AFM friction on MoS2 described by REBO-MoS (pot_type = rebomos) instead of SW.
#   FrictionSim2D run afm examples/afm/rebomos.ini -o ./afm_output
# Only [2D] changes: pot_path names the packaged REBO-MoS file.
# Lengths in Angstrom, forces in nN, speeds in m/s.

[2D]
mat = h-MoS2 # material name, used in output directory names
cif_path = materials/h-MoS2.cif # sheet structure (CIF)
x = 50 # sheet length, Angstrom (>= 2x the tip diameter)
y = 50 # sheet width, Angstrom
layers = [1] # layer counts; a list sweeps
pot_path = potentials/rebo/MoS.rebomos # sheet potential file
pot_type = rebomos # potential type
stack_type = AB # layer stacking: AB or AA

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 10 # tip radius, Angstrom
dspring = 1.6e-6 # tip damper
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

[sub]
mat = Si # substrate material
amorph = a # a = amorphous, c = crystalline
thickness = 12 # substrate thickness, Angstrom
pot_path = potentials/sw/Si.sw # substrate potential file
pot_type = sw # substrate potential type
cif_path = materials/Si.cif # substrate structure (CIF)

[general]
temp = 300 # temperature, K
force = [5] # normal loads, nN
scan_angle = 0 # scan direction, degrees
driving_spring = 50 # driving spring constant, N/m
scan_speed = 2 # tip scan speed, m/s
finite_sheet = false # true: a finite sheet on the [sub] x/y substrate
