# Tip PES scan on a freestanding buckled SiGe slab described by Tersoff.
#   FrictionSim2D run pes-tip examples/pes-tip/freestanding_tersoff.ini -o ./pes_output
# As freestanding.ini with a different material and potential family: only [2D]
# changes. Lengths in Angstrom, forces in nN.

[2D]
mat = b-SiGe # material name, used in output directory names (b_: buckled)
cif_path = materials/b-SiGe.cif # sheet structure (CIF)
pot_path = potentials/tersoff/1989_SiGe.tersoff # sheet potential file
pot_type = tersoff # potential type
x = 40 # sheet length, Angstrom
y = 40 # sheet width, Angstrom
layers = [2] # slab layers (>= 2; layer 1 is the fixed anchor)
stack_type = AB # layer stacking: AB or AA

[tip]
mat = Si # tip material
amorph = # a = amorphous tip; blank = crystalline
r = 10 # tip radius, Angstrom
pot_path = potentials/sw/Si.sw # tip potential file
pot_type = sw # tip potential type
cif_path = materials/Si.cif # tip structure (CIF)

# No [sub] section: that is what selects the freestanding slab.

[general]
temp = 300 # temperature, K
force = 2 # normal load for the build, nN
scan_speed = 2 # unused by the static scan, m/s
finite_sheet = false # freestanding scans use a periodic sheet

[pes]
grid_n = 3 # N for the N x N lateral grid (small, for a quick scan)
tip_load = 5 # load the contact gap calibrates to, nN
eval_mode = minimize # minimize or md
