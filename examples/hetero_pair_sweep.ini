# ---------------------------------------------------------------------------
# Heterostructure sweep: one sheet-on-sheet run per ordered material pair.
#
# Two numbered sheet sections make this a heterostructure config: [2D-1] is the
# bottom material, [2D-2] the top. The pair list drives the sweep -- one run per
# line, into its own `h-MoS2+h-WS2` directory. Run with:
#   FrictionSim2D run sheetonsheet examples/hetero_pair_sweep.ini -o ./hetero_output
#
# The same [2D-1]/[2D-2] pair works for `run afm`, `run indent`, `run pes-tip`
# and `run pes-sheet` -- add that model's own sections ([tip], [sub], [pes], ...).
# ---------------------------------------------------------------------------

# ----------------------- Bottom material ---
[2D-1]
# One ordered pair per line, members separated by '+'. A comma would mean two
# SEPARATE single materials instead, which a config with a [2D-2] section
# rejects -- see documentation/configuration.md.
materials_list = examples/hetero_pairs.txt
mat = {mat1} # {mat} is the same placeholder as {mat1}
cif_path = examples/materials/{mat1}.cif
pot_path = examples/potentials/sw/sw_lammps/{mat1}.sw
pot_type = sw
x = 12 # length of sheet in Angstrom
y = 12 # width of sheet in Angstrom
layers = [2] # exactly one value per material; 2 + 2 = a 4-layer stack
stack_type = AB # AB or AA

# ----------------------- Top material ------
# Only [2D-1] carries materials_list; [2D-2] is filled from the same line's
# second member.
[2D-2]
mat = {mat2}
cif_path = examples/materials/{mat2}.cif
pot_path = examples/potentials/sw/sw_lammps/{mat2}.sw
pot_type = sw
x = 12 # length of sheet in Angstrom
y = 12 # width of sheet in Angstrom
layers = [2]
stack_type = AB

# ----------------------- General -----------
[general]
temp = 300 # in K
pressure = 0.1 # in GPa
scan_speed = 1 # scan speed m/s
hetero_stacking = grouped # 'grouped' (1,1,2,2) or 'alternating' (1,2,1,2)
