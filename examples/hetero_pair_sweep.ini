# Heterostructure sweep: one sheet-on-sheet run per ordered pair in hetero_pairs.txt.
#   FrictionSim2D run sheetonsheet examples/hetero_pair_sweep.ini -o ./hetero_output
# [2D-1] is the bottom material, [2D-2] the top; each run lands in its own
# h-MoS2+h-WS2 directory. The same pair of sections works for run afm, indent,
# pes-tip and pes-sheet with that model's own sections added. Lengths in
# Angstrom, pressure in GPa.

[2D-1]
materials_list = examples/hetero_pairs.txt # one 'A + B' pair per line (path from the repo root)
mat = {mat1} # first member of each pair ({mat} means the same)
cif_path = materials/{mat1}.cif # bottom structure per pair
pot_path = potentials/sw/sw_lammps/{mat1}.sw # bottom potential per pair
pot_type = sw # potential type
x = 12 # sheet length, Angstrom
y = 12 # sheet width, Angstrom
layers = [2] # layers of this material (one value); 2 + 2 = a 4-layer stack
stack_type = AB # layer stacking: AB or AA

[2D-2]
mat = {mat2} # second member of each pair (only [2D-1] has materials_list)
cif_path = materials/{mat2}.cif # top structure per pair
pot_path = potentials/sw/sw_lammps/{mat2}.sw # top potential per pair
pot_type = sw # potential type
x = 12 # sheet length, Angstrom
y = 12 # sheet width, Angstrom
layers = [2] # layers of this material (one value)
stack_type = AB # layer stacking: AB or AA

[general]
temp = 300 # temperature, K
pressure = 0.1 # normal pressure, GPa
scan_speed = 1 # sliding speed, m/s
hetero_stacking = grouped # layer order: grouped (1,1,2,2) or alternating (1,2,1,2)
